<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planilha Financeira — Gui & Nic</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root[data-theme="light"] {
      --bg: #f5f5f3; --s1: #fcfcfb; --s2: #eeeeed; --s3: #e1e0d9;
      --txt: #0b0b0b; --txt2: #52514e; --muted: #898781;
      --blue: #2a78d6; --orange: #eb6834; --green: #1baf7a;
      --yellow: #eda100; --pink: #e87ba4; --teal: #008300;
      --violet: #4a3aa7; --red: #e34948;
      --pos: #006300; --neg: #c0392b; --warn: #b07d00;
      --card-border: rgba(11,11,11,0.09);
    }
    :root[data-theme="dark"] {
      --bg: #111110; --s1: #1a1a19; --s2: #242422; --s3: #2c2c2a;
      --txt: #f5f5f3; --txt2: #c3c2b7; --muted: #6b6a66;
      --blue: #3987e5; --orange: #d95926; --green: #199e70;
      --yellow: #c98500; --pink: #d55181; --teal: #009900;
      --violet: #9085e9; --red: #e66767;
      --pos: #0ca30c; --neg: #e66767; --warn: #fab219;
      --card-border: rgba(255,255,255,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--txt); font-size: 14px; line-height: 1.5;
    }

    /* ── Header ── */
    .hdr {
      background: var(--s1); border-bottom: 1px solid var(--s3);
      display: flex; align-items: center; gap: 12px; padding: 0 20px;
      height: 52px; position: sticky; top: 0; z-index: 100;
    }
    .hdr-title { font-size: 15px; font-weight: 700; flex: 1; }
    .hdr-title small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
    .ico-btn {
      background: none; border: 1px solid var(--s3); border-radius: 5px;
      color: var(--txt2); cursor: pointer; font-size: 13px; padding: 5px 10px; line-height: 1;
    }
    .ico-btn:hover { border-color: var(--blue); color: var(--blue); }

    /* ── Month tabs ── */
    .month-nav {
      background: var(--s1); border-bottom: 2px solid var(--s3);
      display: flex; overflow-x: auto; padding: 0 20px; gap: 2px;
    }
    .month-tab {
      background: none; border: none; border-bottom: 3px solid transparent;
      color: var(--txt2); cursor: pointer; font-size: 13px; font-weight: 500;
      padding: 11px 14px; white-space: nowrap; transition: all 0.15s;
      margin-bottom: -2px;
    }
    .month-tab:hover { color: var(--txt); }
    .month-tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
    .month-tab.dashboard-tab { color: var(--muted); font-size: 12px; }
    .month-tab.dashboard-tab.active { color: var(--blue); }

    /* ── Pane layout ── */
    .pane { display: none; padding: 20px; max-width: 1100px; margin: 0 auto; }
    .pane.active { display: block; }

    /* ── Summary bar ── */
    .summary-bar {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px;
    }
    .sum-card {
      background: var(--s1); border: 1px solid var(--card-border);
      border-radius: 8px; padding: 16px 18px;
    }
    .sum-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
    .sum-val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sum-val.inc { color: var(--pos); }
    .sum-val.exp { color: var(--neg); }
    .sum-val.bal { color: var(--blue); }
    .sum-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }

    /* ── Two-column layout ── */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }

    /* ── Section card ── */
    .sec {
      background: var(--s1); border: 1px solid var(--card-border);
      border-radius: 8px; overflow: hidden; margin-bottom: 16px;
    }
    .sec-head {
      background: var(--s2); border-bottom: 1px solid var(--s3);
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
    }
    .sec-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--txt2); }
    .sec-total { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sec-total.inc { color: var(--pos); } .sec-total.exp { color: var(--neg); }

    /* ── Editable rows ── */
    .edit-row {
      display: grid; gap: 0; border-bottom: 1px solid var(--s3);
      grid-template-columns: 1fr 130px 36px;
      align-items: center;
    }
    .edit-row:last-child { border-bottom: none; }
    .edit-row:hover { background: color-mix(in srgb, var(--s2) 50%, transparent); }
    .row-name, .row-val {
      background: none; border: none; color: var(--txt); font-family: inherit;
      font-size: 13px; padding: 9px 14px; width: 100%; outline: none;
    }
    .row-name { font-weight: 500; }
    .row-val { text-align: right; font-variant-numeric: tabular-nums; }
    .row-name:focus, .row-val:focus {
      background: color-mix(in srgb, var(--blue) 7%, var(--s1));
      outline: 2px solid var(--blue); outline-offset: -2px; border-radius: 2px;
    }
    .row-del {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 16px; padding: 0 10px; line-height: 1; opacity: 0;
      transition: opacity 0.15s;
    }
    .edit-row:hover .row-del { opacity: 1; }
    .row-del:hover { color: var(--neg); }

    /* ── Cards grid ── */
    .cards-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    }
    .card-item {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--s3); border-right: 1px solid var(--s3);
      padding: 10px 14px; gap: 8px;
    }
    .card-item:nth-child(2n) { border-right: none; }
    .card-item:nth-last-child(-n+2) { border-bottom: none; }
    .card-name { font-size: 13px; font-weight: 500; color: var(--txt2); flex: 1; white-space: nowrap; }
    .card-val-wrap { display: flex; align-items: center; gap: 4px; }
    .card-prefix { font-size: 12px; color: var(--muted); }
    .card-val {
      background: none; border: 1px solid transparent; border-radius: 5px;
      color: var(--txt); font-family: inherit; font-size: 13px; font-weight: 600;
      font-variant-numeric: tabular-nums; padding: 4px 8px; text-align: right;
      width: 110px; outline: none; transition: border-color 0.15s, background 0.15s;
    }
    .card-val:focus { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 7%, var(--s1)); }
    .card-val.has-val { color: var(--neg); }

    /* ── Variable expenses ── */
    .var-table { width: 100%; border-collapse: collapse; }
    .var-table th {
      background: var(--s2); border-bottom: 1px solid var(--s3);
      color: var(--muted); font-size: 10px; font-weight: 700;
      letter-spacing: .06em; padding: 8px 12px; text-align: left; text-transform: uppercase;
    }
    .var-table td { border-bottom: 1px solid var(--s3); padding: 0; }
    .var-table tr:last-child td { border-bottom: none; }
    .var-table tbody tr:hover td { background: color-mix(in srgb, var(--s2) 50%, transparent); }
    .var-cell {
      background: none; border: none; color: var(--txt); font-family: inherit;
      font-size: 13px; padding: 9px 12px; width: 100%; outline: none;
    }
    .var-cell:focus {
      background: color-mix(in srgb, var(--blue) 7%, var(--s1));
      outline: 2px solid var(--blue); outline-offset: -2px; border-radius: 2px;
    }
    select.var-cell { cursor: pointer; }
    .var-amt { text-align: right; font-variant-numeric: tabular-nums; color: var(--neg); font-weight: 600; }
    .var-del {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 15px; padding: 0 10px; line-height: 1; width: 36px;
    }
    .var-del:hover { color: var(--neg); }
    .var-table tr:not(:hover) .var-del { opacity: 0.3; }

    /* ── Add expense button ── */
    .add-exp-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-top: 1px solid var(--s3); background: var(--s2);
    }
    .btn-add {
      background: var(--blue); border: none; border-radius: 6px; color: #fff;
      cursor: pointer; font-size: 13px; font-weight: 600; padding: 7px 16px;
    }
    .btn-add:hover { opacity: 0.88; }
    .btn-add-sm {
      background: none; border: 1px solid var(--s3); border-radius: 5px;
      color: var(--txt2); cursor: pointer; font-size: 12px; padding: 5px 10px;
    }
    .btn-add-sm:hover { border-color: var(--blue); color: var(--blue); }

    /* ── FAB ── */
    .fab {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--blue); border: none; border-radius: 50px; color: #fff;
      cursor: pointer; font-size: 14px; font-weight: 700;
      padding: 13px 22px; box-shadow: 0 4px 16px rgba(42,120,214,.45);
      z-index: 50; transition: transform 0.15s, box-shadow 0.15s;
    }
    .fab:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(42,120,214,.55); }

    /* ── Total footer row ── */
    .total-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px; background: var(--s2); border-top: 1px solid var(--s3);
      font-size: 13px; font-weight: 700;
    }
    .total-row .lbl { color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: .05em; }
    .total-row .val { font-variant-numeric: tabular-nums; }

    /* ── Dashboard charts ── */
    .dash-row { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; margin-bottom: 16px; }
    .chart-card {
      background: var(--s1); border: 1px solid var(--card-border);
      border-radius: 8px; padding: 18px;
    }
    .chart-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 14px; }
    .chart-wrap { position: relative; height: 200px; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .leg-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--txt2); }
    .leg-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    /* ── Annual summary table ── */
    .annual-table { width: 100%; border-collapse: collapse; }
    .annual-table th {
      background: var(--s2); border-bottom: 1px solid var(--s3); border-right: 1px solid var(--s3);
      color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .05em;
      padding: 9px 14px; text-align: right; text-transform: uppercase;
    }
    .annual-table th:first-child { text-align: left; }
    .annual-table td {
      border-bottom: 1px solid var(--s3); border-right: 1px solid var(--s3);
      font-size: 13px; font-variant-numeric: tabular-nums; padding: 9px 14px; text-align: right;
    }
    .annual-table td:first-child { font-weight: 600; text-align: left; }
    .annual-table tbody tr:hover td { background: color-mix(in srgb, var(--s2) 40%, transparent); }
    .annual-table td.pos { color: var(--pos); font-weight: 600; }
    .annual-table td.neg { color: var(--neg); font-weight: 600; }

    /* ── Misc ── */
    .empty { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; }
    .sep { height: 1px; background: var(--s3); margin: 20px 0; }

    @media (max-width: 640px) {
      .two-col { grid-template-columns: 1fr; }
      .summary-bar { grid-template-columns: 1fr 1fr; }
      .dash-row { grid-template-columns: 1fr; }
      .cards-grid { grid-template-columns: 1fr; }
      .card-item:nth-child(2n) { border-right: none; }
      .card-item { border-right: none; }
    }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header class="hdr">
  <span class="hdr-title">💰 Planilha Financeira <small>Gui &amp; Nic · 2026</small></span>
  <button class="ico-btn" id="btnTheme" onclick="App.toggleTheme()">🌙</button>
  <button class="ico-btn" onclick="App.exportCSV()">⬇ CSV</button>
</header>

<!-- ── Month tabs ── -->
<nav class="month-nav" id="monthNav"></nav>

<!-- ── Panes (generated dynamically) ── -->
<div id="paneContainer"></div>

<!-- ── Floating Add Expense button ── -->
<button class="fab" id="fabBtn" onclick="App.addVarExpense(App.activeMonth)" title="Adicionar despesa variável">
  + Despesa
</button>

<script>
// ─── Constants ───────────────────────────────────────────────────────────────

const MONTHS = [
  { key:'2026-07', short:'Jul 26', long:'Julho 2026' },
  { key:'2026-08', short:'Ago 26', long:'Agosto 2026' },
  { key:'2026-09', short:'Set 26', long:'Setembro 2026' },
  { key:'2026-10', short:'Out 26', long:'Outubro 2026' },
  { key:'2026-11', short:'Nov 26', long:'Novembro 2026' },
  { key:'2026-12', short:'Dez 26', long:'Dezembro 2026' },
];

const DEFAULT_INCOME = [
  { id:'fi1', name:'Salário Líquido Gui', amount:8000 },
  { id:'fi2', name:'Comissão Gui',        amount:0    },
  { id:'fi3', name:'Salário Líquido Nic', amount:4200 },
  { id:'fi4', name:'Comissão Nic',        amount:0    },
];

const DEFAULT_FIXED = [
  { id:'fe01', name:'Apartamento Principal',   amount:2700 },
  { id:'fe02', name:'Condomínio',              amount:675  },
  { id:'fe03', name:'Parcelamento condomínio', amount:360  },
  { id:'fe04', name:'Apartamento menor',       amount:1000 },
  { id:'fe05', name:'Condomínio menor',        amount:300  },
  { id:'fe06', name:'Parc. cond. menor',       amount:115  },
  { id:'fe07', name:'Carro',                   amount:1200 },
  { id:'fe08', name:'Luz',                     amount:250  },
  { id:'fe09', name:'Internet',                amount:120  },
  { id:'fe10', name:'Seguro Carro',            amount:150  },
  { id:'fe11', name:'Aplicativos',             amount:200  },
  { id:'fe12', name:'Claro Nic',               amount:100  },
  { id:'fe13', name:'Tim Gui',                 amount:65   },
  { id:'fe14', name:'PSN',                     amount:80   },
];

const DEFAULT_CARDS = [
  { id:'cc1', name:'Cartão Marisa',       amount:0 },
  { id:'cc2', name:'Cartão Casas Bahia',  amount:0 },
  { id:'cc3', name:'Cartão Renner',       amount:0 },
  { id:'cc4', name:'Cartão Mercado Pago', amount:0 },
];

const VAR_CATS = ['Alimentação','Saúde','Lazer','Vestuário','Farmácia','Transporte','Educação','Outros'];

const PALETTE = {
  light: ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'],
  dark:  ['#3987e5','#d95926','#199e70','#c98500','#d55181','#009900','#9085e9','#e66767'],
};

// ─── App ─────────────────────────────────────────────────────────────────────

const App = {
  state: null,
  activeMonth: MONTHS[0].key,
  charts: { bar: null, donut: null },

  // ── Init ──

  init() {
    this.state = this.loadState();
    this.applyTheme(this.state.theme);
    this.buildNav();
    this.buildPanes();
    this.switchTab(this.activeMonth);
  },

  defaultMonth(key) {
    return {
      income:   DEFAULT_INCOME.map(r => ({ ...r })),
      fixed:    DEFAULT_FIXED.map(r => ({ ...r })),
      cards:    DEFAULT_CARDS.map(r => ({ ...r })),
      varExp:   [],
    };
  },

  ensureMonth(key) {
    if (!this.state.months[key]) {
      this.state.months[key] = this.defaultMonth(key);
      this.save();
    }
    return this.state.months[key];
  },

  loadState() {
    try {
      const raw = localStorage.getItem('pf-guinic-v1');
      if (raw) {
        const s = JSON.parse(raw);
        if (!s.months) s.months = {};
        return s;
      }
    } catch {}
    return { theme: 'light', months: {} };
  },

  save() { localStorage.setItem('pf-guinic-v1', JSON.stringify(this.state)); },

  // ── Theme ──

  toggleTheme() {
    this.state.theme = this.state.theme === 'light' ? 'dark' : 'light';
    this.applyTheme(this.state.theme);
    this.save();
    if (this.activeMonth === 'dashboard') this.renderDashboard();
  },

  applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('btnTheme').textContent = t === 'light' ? '🌙' : '☀️';
  },

  // ── Navigation ──

  buildNav() {
    const nav = document.getElementById('monthNav');
    const dashBtn = `<button class="month-tab dashboard-tab" data-key="dashboard" onclick="App.switchTab('dashboard')">📊 Dashboard</button>`;
    const monthBtns = MONTHS.map(m =>
      `<button class="month-tab" data-key="${m.key}" onclick="App.switchTab('${m.key}')">${m.short}</button>`
    ).join('');
    nav.innerHTML = dashBtn + monthBtns;
  },

  switchTab(key) {
    this.activeMonth = key;
    document.querySelectorAll('.month-tab').forEach(b => b.classList.toggle('active', b.dataset.key === key));
    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + key));
    document.getElementById('fabBtn').style.display = key === 'dashboard' ? 'none' : '';
    if (key === 'dashboard') {
      this.renderDashboard();
    } else {
      this.renderMonth(key);
    }
  },

  // ── Pane scaffolding ──

  buildPanes() {
    const container = document.getElementById('paneContainer');
    // Dashboard pane
    container.innerHTML = `<div class="pane" id="pane-dashboard">
      <div class="dash-row">
        <div class="chart-card">
          <div class="chart-title">Receitas × Despesas — Jul a Dez 2026</div>
          <div class="chart-wrap"><canvas id="chartBar"></canvas></div>
          <div class="legend" id="legendBar"></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Despesas do Mês Atual</div>
          <div class="chart-wrap"><canvas id="chartDonut"></canvas></div>
          <div class="legend" id="legendDonut"></div>
        </div>
      </div>
      <div class="sec">
        <div class="sec-head"><span class="sec-title">Resumo Anual</span></div>
        <div style="overflow-x:auto"><table class="annual-table" id="annualTable"></table></div>
      </div>
    </div>`;
    // Month panes
    MONTHS.forEach(m => {
      const div = document.createElement('div');
      div.className = 'pane';
      div.id = 'pane-' + m.key;
      container.appendChild(div);
    });
  },

  // ── Dashboard rendering ──

  renderDashboard() {
    const cols = PALETTE[this.state.theme];
    const gridC = getComputedStyle(document.documentElement).getPropertyValue('--s3').trim();
    const mutedC = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();
    const fmtK = v => 'R$ ' + v.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
    const fmtFull = v => 'R$ ' + Math.abs(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const monthData = MONTHS.map(m => {
      const d = this.ensureMonth(m.key);
      const inc = this.sumArr(d.income) + this.sumArr(d.cards.map(() => 0)); // income only
      const incTotal = this.sumArr(d.income);
      const expFixed = this.sumArr(d.fixed);
      const expCards = this.sumArr(d.cards);
      const expVar   = this.sumArr(d.varExp);
      const expTotal = expFixed + expCards + expVar;
      return { label: m.short, inc: incTotal, exp: expTotal, bal: incTotal - expTotal };
    });

    // Bar chart
    if (this.charts.bar) this.charts.bar.destroy();
    this.charts.bar = new Chart(document.getElementById('chartBar'), {
      type: 'bar',
      data: {
        labels: monthData.map(d => d.label),
        datasets: [
          { label:'Receitas', data: monthData.map(d => d.inc), backgroundColor: cols[0], borderRadius: 4, borderSkipped:'bottom', barPercentage:.7 },
          { label:'Despesas', data: monthData.map(d => d.exp), backgroundColor: cols[1], borderRadius: 4, borderSkipped:'bottom', barPercentage:.7 },
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins: { legend:{display:false}, tooltip:{ callbacks:{ label: ctx => ` ${ctx.dataset.label}: ${fmtK(ctx.raw)}` } } },
        scales: {
          x: { grid:{display:false}, border:{display:false}, ticks:{color:mutedC, font:{size:11}} },
          y: { grid:{color:gridC}, border:{display:false}, ticks:{color:mutedC, font:{size:11}, callback:fmtK} }
        }
      }
    });
    document.getElementById('legendBar').innerHTML = ['Receitas','Despesas'].map((l,i) =>
      `<span class="leg-item"><span class="leg-dot" style="background:${cols[i]}"></span>${l}</span>`
    ).join('');

    // Donut: current month expense breakdown
    const cur = this.ensureMonth(MONTHS[0].key);
    const donutData = [
      { label:'Fixas',    val: this.sumArr(cur.fixed) },
      { label:'Cartões',  val: this.sumArr(cur.cards) },
      { label:'Variáveis',val: this.sumArr(cur.varExp) },
    ].filter(d => d.val > 0);

    if (this.charts.donut) this.charts.donut.destroy();
    if (donutData.length) {
      this.charts.donut = new Chart(document.getElementById('chartDonut'), {
        type:'doughnut',
        data:{
          labels: donutData.map(d => d.label),
          datasets:[{ data: donutData.map(d => d.val), backgroundColor: donutData.map((_,i) => cols[i+1]), borderWidth:2, borderColor: this.getCSSVar('--s1'), hoverOffset:5 }]
        },
        options:{
          responsive:true, maintainAspectRatio:false, cutout:'62%',
          plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => ` ${ctx.label}: ${fmtK(ctx.raw)}` } } }
        }
      });
    }
    document.getElementById('legendDonut').innerHTML = donutData.map((d,i) =>
      `<span class="leg-item"><span class="leg-dot" style="background:${cols[i+1]};border-radius:50%"></span>${d.label}</span>`
    ).join('');

    // Annual table
    const thead = `<thead><tr>
      <th>Mês</th><th>Receitas</th><th>Desp. Fixas</th><th>Cartões</th><th>Variáveis</th><th>Total Desp.</th><th>Saldo</th>
    </tr></thead>`;
    const rows = MONTHS.map(m => {
      const d = this.ensureMonth(m.key);
      const inc  = this.sumArr(d.income);
      const fix  = this.sumArr(d.fixed);
      const crd  = this.sumArr(d.cards);
      const vr   = this.sumArr(d.varExp);
      const exp  = fix + crd + vr;
      const bal  = inc - exp;
      const balCls = bal >= 0 ? 'pos' : 'neg';
      return `<tr>
        <td>${m.long}</td>
        <td class="pos">${fmtFull(inc)}</td>
        <td>${fmtFull(fix)}</td>
        <td>${fmtFull(crd)}</td>
        <td>${fmtFull(vr)}</td>
        <td class="neg">${fmtFull(exp)}</td>
        <td class="${balCls}">${bal>=0?'+':'−'}${fmtFull(Math.abs(bal))}</td>
      </tr>`;
    }).join('');
    document.getElementById('annualTable').innerHTML = thead + `<tbody>${rows}</tbody>`;
  },

  // ── Month rendering ──

  renderMonth(key) {
    const data = this.ensureMonth(key);
    const pane = document.getElementById('pane-' + key);
    const mo = MONTHS.find(m => m.key === key);

    const incTotal  = this.sumArr(data.income);
    const fixTotal  = this.sumArr(data.fixed);
    const cardTotal = this.sumArr(data.cards);
    const varTotal  = this.sumArr(data.varExp);
    const expTotal  = fixTotal + cardTotal + varTotal;
    const saldo     = incTotal - expTotal;
    const econ      = incTotal > 0 ? (saldo / incTotal * 100) : 0;
    const saldoCls  = saldo >= 0 ? 'bal' : 'exp';

    pane.innerHTML = `
      <!-- Summary bar -->
      <div class="summary-bar">
        <div class="sum-card">
          <div class="sum-label">Receitas</div>
          <div class="sum-val inc">${this.fmt(incTotal)}</div>
          <div class="sum-sub">${data.income.filter(r=>r.amount>0).length} itens</div>
        </div>
        <div class="sum-card">
          <div class="sum-label">Despesas Totais</div>
          <div class="sum-val exp">${this.fmt(expTotal)}</div>
          <div class="sum-sub">Fixas + Cartões + Variáveis</div>
        </div>
        <div class="sum-card">
          <div class="sum-label">Saldo do Mês</div>
          <div class="sum-val ${saldoCls}">${saldo>=0?'':'−'}${this.fmt(Math.abs(saldo))}</div>
          <div class="sum-sub">${econ>=0?'Economia':'Déficit'}: ${Math.abs(econ).toFixed(1)}%</div>
        </div>
        <div class="sum-card">
          <div class="sum-label">Fixas + Cartões</div>
          <div class="sum-val" style="color:var(--yellow)">${this.fmt(fixTotal+cardTotal)}</div>
          <div class="sum-sub">Compromissos fixos</div>
        </div>
      </div>

      <!-- Receitas + Despesas Fixas -->
      <div class="two-col">
        <div class="sec">
          <div class="sec-head">
            <span class="sec-title">📥 Receitas</span>
            <span class="sec-total inc">${this.fmt(incTotal)}</span>
          </div>
          <div id="incomeRows-${key}"></div>
          <div class="add-exp-row">
            <button class="btn-add-sm" onclick="App.addIncomeRow('${key}')">+ Linha</button>
          </div>
        </div>

        <div class="sec">
          <div class="sec-head">
            <span class="sec-title">🏠 Despesas Fixas</span>
            <span class="sec-total exp">${this.fmt(fixTotal)}</span>
          </div>
          <div id="fixedRows-${key}"></div>
          <div class="add-exp-row">
            <button class="btn-add-sm" onclick="App.addFixedRow('${key}')">+ Linha</button>
          </div>
        </div>
      </div>

      <!-- Cartões -->
      <div class="sec">
        <div class="sec-head">
          <span class="sec-title">💳 Cartões</span>
          <span class="sec-total exp">${this.fmt(cardTotal)}</span>
        </div>
        <div class="cards-grid" id="cardsGrid-${key}"></div>
      </div>

      <!-- Despesas Variáveis -->
      <div class="sec">
        <div class="sec-head">
          <span class="sec-title">🛒 Despesas Variáveis</span>
          <span class="sec-total exp">${this.fmt(varTotal)}</span>
        </div>
        <table class="var-table">
          <thead>
            <tr>
              <th style="width:130px">Data</th>
              <th>Descrição</th>
              <th style="width:140px">Categoria</th>
              <th style="width:130px;text-align:right">Valor (R$)</th>
              <th style="width:36px"></th>
            </tr>
          </thead>
          <tbody id="varRows-${key}"></tbody>
        </table>
        <div class="add-exp-row">
          <button class="btn-add" onclick="App.addVarExpense('${key}')">+ Adicionar Despesa</button>
          <span style="font-size:12px;color:var(--muted)">${data.varExp.length} lançamento(s)</span>
        </div>
      </div>
    `;

    this.renderIncomeRows(key);
    this.renderFixedRows(key);
    this.renderCardsGrid(key);
    this.renderVarRows(key);
  },

  renderIncomeRows(key) {
    const data = this.ensureMonth(key);
    const el = document.getElementById('incomeRows-' + key);
    if (!el) return;
    el.innerHTML = data.income.map((r, i) => `
      <div class="edit-row">
        <input class="row-name" value="${this.esc(r.name)}" placeholder="Descrição..."
          onchange="App.updateIncome('${key}',${i},'name',this.value)">
        <input class="row-val" type="number" step="0.01" value="${r.amount||''}" placeholder="0,00"
          onchange="App.updateIncome('${key}',${i},'amount',parseFloat(this.value)||0)">
        <button class="row-del" onclick="App.deleteIncome('${key}',${i})" title="Remover">×</button>
      </div>
    `).join('');
  },

  renderFixedRows(key) {
    const data = this.ensureMonth(key);
    const el = document.getElementById('fixedRows-' + key);
    if (!el) return;
    el.innerHTML = data.fixed.map((r, i) => `
      <div class="edit-row">
        <input class="row-name" value="${this.esc(r.name)}" placeholder="Descrição..."
          onchange="App.updateFixed('${key}',${i},'name',this.value)">
        <input class="row-val" type="number" step="0.01" value="${r.amount||''}" placeholder="0,00"
          onchange="App.updateFixed('${key}',${i},'amount',parseFloat(this.value)||0)">
        <button class="row-del" onclick="App.deleteFixed('${key}',${i})" title="Remover">×</button>
      </div>
    `).join('');
  },

  renderCardsGrid(key) {
    const data = this.ensureMonth(key);
    const el = document.getElementById('cardsGrid-' + key);
    if (!el) return;
    el.innerHTML = data.cards.map((c, i) => {
      const hasCls = c.amount > 0 ? ' has-val' : '';
      return `
        <div class="card-item">
          <span class="card-name">💳 ${this.esc(c.name)}</span>
          <div class="card-val-wrap">
            <span class="card-prefix">R$</span>
            <input class="card-val${hasCls}" type="number" step="0.01"
              value="${c.amount || ''}" placeholder="0,00"
              onchange="App.updateCard('${key}',${i},parseFloat(this.value)||0);this.classList.toggle('has-val',parseFloat(this.value)>0)">
          </div>
        </div>`;
    }).join('');
  },

  renderVarRows(key) {
    const data = this.ensureMonth(key);
    const tbody = document.getElementById('varRows-' + key);
    if (!tbody) return;
    if (data.varExp.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty">Nenhuma despesa variável. Clique em "+ Adicionar Despesa".</td></tr>`;
      return;
    }
    const catOpts = (sel) => VAR_CATS.map(c => `<option ${c===sel?'selected':''}>${c}</option>`).join('');
    tbody.innerHTML = data.varExp.map((v, i) => `
      <tr>
        <td><input class="var-cell" type="date" value="${v.date}"
          onchange="App.updateVar('${key}',${i},'date',this.value)"></td>
        <td><input class="var-cell" type="text" value="${this.esc(v.desc)}" placeholder="Descrição..."
          onchange="App.updateVar('${key}',${i},'desc',this.value)"></td>
        <td><select class="var-cell" onchange="App.updateVar('${key}',${i},'cat',this.value)">${catOpts(v.cat)}</select></td>
        <td><input class="var-cell var-amt" type="number" step="0.01" value="${v.amount||''}" placeholder="0,00"
          onchange="App.updateVar('${key}',${i},'amount',parseFloat(this.value)||0)"></td>
        <td><button class="var-del" onclick="App.deleteVar('${key}',${i})" title="Remover">×</button></td>
      </tr>
    `).join('');
  },

  // ── Data mutations ──

  updateIncome(key, i, field, val) {
    this.state.months[key].income[i][field] = val;
    this.save(); this.updateSummary(key); this.renderIncomeRows(key);
  },
  deleteIncome(key, i) {
    this.state.months[key].income.splice(i, 1);
    this.save(); this.renderMonth(key);
  },
  addIncomeRow(key) {
    this.state.months[key].income.push({ id:'fi-'+Date.now(), name:'', amount:0 });
    this.save(); this.renderMonth(key);
    setTimeout(() => {
      const rows = document.querySelectorAll(`#incomeRows-${key} .edit-row`);
      rows[rows.length-1]?.querySelector('.row-name')?.focus();
    }, 50);
  },

  updateFixed(key, i, field, val) {
    this.state.months[key].fixed[i][field] = val;
    this.save(); this.updateSummary(key); this.renderFixedRows(key);
  },
  deleteFixed(key, i) {
    this.state.months[key].fixed.splice(i, 1);
    this.save(); this.renderMonth(key);
  },
  addFixedRow(key) {
    this.state.months[key].fixed.push({ id:'fe-'+Date.now(), name:'', amount:0 });
    this.save(); this.renderMonth(key);
    setTimeout(() => {
      const rows = document.querySelectorAll(`#fixedRows-${key} .edit-row`);
      rows[rows.length-1]?.querySelector('.row-name')?.focus();
    }, 50);
  },

  updateCard(key, i, val) {
    this.state.months[key].cards[i].amount = val;
    this.save(); this.updateSummary(key);
  },

  updateVar(key, i, field, val) {
    this.state.months[key].varExp[i][field] = val;
    this.save(); this.updateSummary(key);
  },
  deleteVar(key, i) {
    this.state.months[key].varExp.splice(i, 1);
    this.save(); this.renderMonth(key);
  },
  addVarExpense(key) {
    const d = this.ensureMonth(key);
    const today = new Date().toISOString().slice(0,10);
    d.varExp.push({ id:'vx-'+Date.now(), date:today, desc:'', cat:'Outros', amount:0 });
    this.save(); this.renderMonth(key);
    setTimeout(() => {
      const rows = document.querySelectorAll(`#varRows-${key} tr`);
      rows[rows.length-1]?.querySelector('input[type=text]')?.focus();
    }, 50);
  },

  // ── Summary update (lightweight, no full re-render) ──

  updateSummary(key) {
    const data = this.state.months[key];
    if (!data) return;
    const incTotal  = this.sumArr(data.income);
    const fixTotal  = this.sumArr(data.fixed);
    const cardTotal = this.sumArr(data.cards);
    const varTotal  = this.sumArr(data.varExp);
    const expTotal  = fixTotal + cardTotal + varTotal;
    const saldo     = incTotal - expTotal;
    const econ      = incTotal > 0 ? (saldo / incTotal * 100) : 0;

    const pane = document.getElementById('pane-' + key);
    if (!pane) return;
    const cards = pane.querySelectorAll('.sum-card');
    if (cards.length < 4) return;
    const saldoCls = saldo >= 0 ? 'bal' : 'exp';
    cards[0].querySelector('.sum-val').textContent = this.fmt(incTotal);
    cards[1].querySelector('.sum-val').textContent = this.fmt(expTotal);
    cards[2].querySelector('.sum-val').className = `sum-val ${saldoCls}`;
    cards[2].querySelector('.sum-val').textContent = (saldo>=0?'':'−') + this.fmt(Math.abs(saldo));
    cards[2].querySelector('.sum-sub').textContent = `${econ>=0?'Economia':'Déficit'}: ${Math.abs(econ).toFixed(1)}%`;
    cards[3].querySelector('.sum-val').textContent = this.fmt(fixTotal + cardTotal);

    // Update section totals
    const sectTotals = pane.querySelectorAll('.sec-total');
    if (sectTotals[0]) sectTotals[0].textContent = this.fmt(incTotal);
    if (sectTotals[1]) sectTotals[1].textContent = this.fmt(fixTotal);
    if (sectTotals[2]) sectTotals[2].textContent = this.fmt(cardTotal);
    if (sectTotals[3]) sectTotals[3].textContent = this.fmt(varTotal);
  },

  // ── Export ──

  exportCSV() {
    const key = this.activeMonth;
    if (key === 'dashboard') { alert('Selecione um mês para exportar.'); return; }
    const data = this.ensureMonth(key);
    const mo = MONTHS.find(m => m.key === key);
    const rows = [['Tipo','Descrição','Categoria','Valor']];
    data.income.forEach(r => rows.push(['Receita', r.name, 'Receita', r.amount]));
    data.fixed.forEach(r => rows.push(['Desp. Fixa', r.name, 'Fixa', r.amount]));
    data.cards.forEach(r => rows.push(['Cartão', r.name, 'Cartão', r.amount]));
    data.varExp.forEach(r => rows.push(['Desp. Variável', r.desc, r.cat, r.amount]));
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8;' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `financas-${key}.csv`; a.click();
  },

  // ── Helpers ──

  sumArr(arr) { return arr.reduce((s, r) => s + (r.amount || 0), 0); },

  fmt(n) {
    return 'R$ ' + Math.abs(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  },

  esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); },

  getCSSVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); },
};

App.init();
</script>
</body>
</html>
